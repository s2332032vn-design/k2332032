<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ケーキの配置</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <div class="container">
        <div class="item">
            <h2 class="title">ショートケーキ</h2>
            <img src="cake01.jpg" alt="ショートケーキ">
            <p class="description">イチゴがのった一番人気のスポンジケーキです。大人から子供まで、年中愛されるケーキです。</p>
        </div>

        <div class="item">
            <h2 class="title">モンブラン</h2>
            <img src="cake02.jpg" alt="モンブラン"> 
            <p class="description">栗をふんだんに使ったケーキです。様々な形状があります。</p>
        </div>

        <div class="item">
            <h2 class="title">ザッハトルテ</h2>
            <img src="cake03.jpg" alt="ザッハトルテ">
            <p class="description">うううううううううううううううううう</p>
        </div>

        <div class="item">
            <h2 class="title">シュークリーム</h2>
            <img src="cake04.jpg" alt="シュークリーム">
            <p class="description">ええええええええええええええええええ</p>
        </div>
    </div>
</body>
</html>
